# =============================================================================
# csi-aws-efs PACK values — COPY-PASTE variant using PALETTE PROFILE VARIABLES.
#
# This is the UI twin of csi-aws-efs-values.yaml.tmpl: identical tuning, but instead
# of Terraform ${...} interpolation it uses Palette profile-variable macros
#   {{.spectro.var.NAME}}
# resolved at cluster deploy time (same macro your storage-layer-efs-csi-manifest.yaml
# used: {{.spectro.var.STORAGE_EFS_ID}}). So a junior tech pastes this into the
# csi-aws-efs pack editor, sets the profile variables ONCE on the profile, and every
# cluster built from it fills in its own EFS id / IRSA role — no Terraform, IL-portable.
# Docs: profiles/.../define-profile-variables (variables work in any pack/manifest/helm layer).
#
# ---- DEFINE THESE PROFILE VARIABLES on the cluster profile (Profile > Variables) ----
#   name=STORAGE_EFS_ID          format=string  required=true
#       default (flat-VPC reuse): fs-0b4c353e97ae4d0af
#       description: EFS filesystem id whose mount targets live in THIS cluster's VPC.
#   name=EFS_CSI_IRSA_ROLE_ARN   format=string  required=false
#       default: "" (empty = static-PV / node path; set for DYNAMIC efs-ap provisioning)
#       description: IRSA role bound to efs-csi-controller-sa (CreateAccessPoint perms).
#   name=AWS_REGION              format=string  required=true  default: us-gov-west-1
#
# ---- REUSE-FLAT PREREQS (build this cluster in domino-flat's VPC) ----
#   * Cluster placement: STATIC into <VPC_ID> (domino-flat-vpc), private subnets
#       1a subnet-0704f472cf84bec98 | 1b subnet-0655d7a30df51c095 | 1c subnet-05292d8c1042dca22
#     -> EFS fs-0b4c353e97ae4d0af mount targets ALREADY exist in these subnets (fsmt-07cda…/0b916…/0bac…).
#   * The ONE new prereq: the new cluster's WORKER-NODE security group must be allowed INBOUND on
#     TCP 2049 (NFS) at the EFS mount-target SG (or the EFS MT SG allows the VPC CIDR 10.0.0.0/16).
#     Without it, mounts hang silently — the classic EFS gotcha.
#   * Isolation note: two clusters on the SAME EFS fs are separated only by access point; Domino
#     creates its OWN AP per install, so dominoshared data stays per-cluster. Fine for sandbox;
#     for real isolation give the second cluster its OWN EFS (still in-VPC) via a new STORAGE_EFS_ID.
#
# Palette REPLACES pack values (no merge) — keep the WHOLE file. Non-FIPS images -> flip the
# "allow non-FIPS packages" toggle; mirror the 4 images (imageswap rewrite, CLAUDE.md rule 6).
# =============================================================================
pack:
  content:
    images:
      - image: us-docker.pkg.dev/palette-images/packs/aws-efs/3.2.0/aws-efs-csi-driver:v3.2.0
      - image: us-docker.pkg.dev/palette-images/packs/aws-efs/3.2.0/livenessprobe:v2.18.0-eksbuild.4
      - image: us-docker.pkg.dev/palette-images/packs/aws-efs/3.2.0/node-driver-registrar:v2.16.0-eksbuild.4
      - image: us-docker.pkg.dev/palette-images/packs/aws-efs/3.2.0/external-provisioner:v6.2.0-eksbuild.3
    charts:
      - repo: https://kubernetes-sigs.github.io/aws-efs-csi-driver/
        name: aws-efs-csi-driver
        version: 4.2.0
  namespace: kube-system

charts:
  aws-efs-csi-driver:
    nameOverride: ""
    fullnameOverride: ""
    useFIPS: false   # non-FIPS images; flag alone does NOT make the layer FIPS-compliant
    portRangeUpperBound: "21049"
    debugLogs: false
    image:
      repository: us-docker.pkg.dev/palette-images/packs/aws-efs/3.2.0/aws-efs-csi-driver
      tag: "v3.2.0"
      pullPolicy: IfNotPresent
    sidecars:
      livenessProbe:
        image:
          repository: us-docker.pkg.dev/palette-images/packs/aws-efs/3.2.0/livenessprobe
          tag: v2.18.0-eksbuild.4
          pullPolicy: IfNotPresent
        resources: {}
        securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false}
      nodeDriverRegistrar:
        image:
          repository: us-docker.pkg.dev/palette-images/packs/aws-efs/3.2.0/node-driver-registrar
          tag: v2.16.0-eksbuild.4
          pullPolicy: IfNotPresent
        resources: {}
        securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false}
      csiProvisioner:
        image:
          repository: us-docker.pkg.dev/palette-images/packs/aws-efs/3.2.0/external-provisioner
          tag: v6.2.0-eksbuild.3
          pullPolicy: IfNotPresent
        resources: {}
        securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false}
        additionalArgs: []
    imagePullSecrets: []

    controller:
      create: true
      name: efs-csi-controller
      replicaCount: 2
      logLevel: 2
      extraCreateMetadata: true
      tags: {}
      deleteAccessPointRootDir: false
      podAnnotations: {}
      podLabels: {}
      hostNetwork: false
      priorityClassName: system-cluster-critical
      dnsPolicy: ClusterFirst
      dnsConfig: {}
      additionalLabels: {}
      resources: {}
      revisionHistoryLimit: 10
      nodeSelector: {}
      tolerations:
        - {key: CriticalAddonsOnly, operator: Exists}
        - {key: efs.csi.aws.com/agent-not-ready, operator: Exists}
      affinity: {}
      env: []
      volumes: []
      volumeMounts: []
      socketDirVolume: {emptyDir: {}}
      serviceAccount:
        create: true
        name: efs-csi-controller-sa
        # IRSA (reconcile-proof EFS-AP creds). Empty var = no annotation effect (static-PV/node path).
        annotations:
          eks.amazonaws.com/role-arn: "{{.spectro.var.EFS_CSI_IRSA_ROLE_ARN}}"
      regionalStsEndpoints: true   # GovCloud: use regional aws-us-gov STS for IRSA
      healthPort: 9909
      podDisruptionBudget:
        enabled: false
        minAvailable: 1
        unhealthyPodEvictionPolicy: IfHealthyBudget
      securityContext: {runAsNonRoot: false, runAsUser: 0, runAsGroup: 0, fsGroup: 0}
      containerSecurityContext: {privileged: true}
      leaderElectionRenewDeadline: 10s
      leaderElectionLeaseDuration: 15s
      timeout: 15s
      workerThreads: 100
      topologySpreadConstraints: []
      fileSystemIdRefs: {enabled: false}
      rollingUpdate: {}

    node:
      logLevel: 2
      volMetricsOptIn: false
      volMetricsRefreshPeriod: 240
      volMetricsFsRateLimit: 5
      hostAliases: {}
      priorityClassName: system-node-critical
      dnsPolicy: ClusterFirst
      dnsConfig: {}
      podLabels: {}
      podAnnotations: {}
      additionalLabels: {}
      resources: {}
      revisionHistoryLimit: 10
      nodeSelector: {}
      tolerations:
        - {operator: Exists}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: eks.amazonaws.com/compute-type, operator: NotIn, values: [fargate, hybrid]}
      serviceAccount:
        create: true
        name: efs-csi-node-sa
        annotations: {}
        disableMutation: false
      healthPort: 9809
      securityContext: {runAsNonRoot: false, runAsUser: 0, runAsGroup: 0, fsGroup: 0}
      env: []
      volumes: []
      volumeMounts: []
      kubeletPath: /var/lib/kubelet
      rollingUpdate: {}
      efsUtilsConfOverrides: ""
      s3filesUtilsConfOverrides: ""

    storageClasses:
    # `dominoshared` RWX class Domino consumes (Domino config: storage_classes.shared.create=false,
    # name=dominoshared). NON-default (EBS spectro-storage-class stays the ONE default). fileSystemId
    # comes from the profile variable so it tracks THIS cluster's in-VPC EFS.
      - name: dominoshared
        annotations:
          storageclass.kubernetes.io/is-default-class: "false"
        mountOptions:
          - tls
        parameters:
          fileSystemId: '{{.spectro.var.STORAGE_EFS_ID}}'
          provisioningMode: efs-ap
          directoryPerms: "700"
          gidRangeStart: "1000"
          gidRangeEnd: "2000"
          basePath: "/dynamic_provisioning"
        reclaimPolicy: Delete
        volumeBindingMode: Immediate

    useHelmHooksForCSIDriver: true
